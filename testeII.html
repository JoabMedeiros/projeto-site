<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste JavaScript</title>

    <script>
        function acendeLampada () {
            document.getElementById("gitluz").src = "imagens/logoGitHub.png";
        }
        function apagaLampada () {
            document.getElementById("gitluz").src = "imagens/logoGit.png";
        }
        function quebraNegona () {
            document.getElementById("gitluz").src = "imagens/logoPython.png";
        }
    </script>
</head>
<body>
    <h1>Acenda a Lâmpada</h1>
    <img src="imagens/logoGit.png" id="gitluz" onmousemove="acendeLampada()" onmouseout="apagaLampada()" onclick="quebraNegona()"/>
</body>
</html>
