<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste JavaScript</title>

    <script>
        var quebrada = false;
        function mudaLampada (tipo) {
            if (tipo  == 1){
                arquivo = "imagens/logoGit.png";
            }
            if (tipo == 2){
                arquivo = "imagens/logoGitHub.png";
            }
            if (tipo == 3){
                arquivo = "imagens/logoPython.png";
            }
            if (!quebrada) {
                document.getElementById("gitluz").arquivo;
                if (tipo == 3) {
                    quebrada = true;
                }
            }
            
        }
    </script>
</head>
<body>
    <h1>Acenda a Lâmpada</h1>
    <img src="imagens/logoGit.png" id="gitluz" onmousemove="mudaLampada(1)" onmouseout="mudaLampada(2)" onclick="mudaLampada(3)"/>
</body>
</html>
